    // =====================================================================
    // 2. MOTEUR AUDIO POLYVALENT AVEC 11 PROFILS SONORES UNIQUES
    // =====================================================================
    class ProceduralAudioMatrix {
      constructor() {
        this.ctx = null;
        this.volume = 0.80;
        this.isMuted = false;
        this.vizLevel = 0.0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setVolume(val) {
        this.volume = Math.max(0.0, Math.min(1.0, val));
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
      }

      play(name, themeId = "amethyst", pan = 0.0) {
        if (!this.ctx || this.isMuted || this.volume <= 0.001) return;
        this.vizLevel = Math.min(1.0, this.vizLevel + 0.80);

        const now = this.ctx.currentTime;
        const master = this.ctx.createGain();
        master.gain.value = this.volume;

        let panner = null;
        if (this.ctx.createStereoPanner) {
          panner = this.ctx.createStereoPanner();
          panner.pan.value = Math.max(-1.0, Math.min(1.0, pan));
          master.connect(panner);
          panner.connect(this.ctx.destination);
        } else {
          master.connect(this.ctx.destination);
        }

        const theme = ALL_THEMES.find(t => t.id === themeId) || ALL_THEMES[0];
        const synthType = theme.synth;

        // --- SONS DE NOTES P-O-U-I-C ---
        if (name.startsWith('note_')) {
          const idx = parseInt(name.split('_')[1], 10) || 0;
          const scale = [523.25, 587.33, 659.25, 783.99, 880.00]; // Do, Ré, Mi, Sol, La
          const f = scale[idx] || 523.25;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          if (synthType === 'chiptune_8bit') {
            osc.type = 'square';
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          } else if (synthType === 'warm_saw') {
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.40, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          } else if (synthType === 'crystal_ice') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f * 2, now);
            gain.gain.setValueAtTime(0.55, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          } else if (synthType === 'retro_brass') {
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          } else if (synthType === 'celestial_choir') {
            osc.type = 'sine';
            const osc2 = this.ctx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(f * 1.5, now);
            osc2.connect(gain);
            osc2.start(now);
            osc2.stop(now + 0.35);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          } else if (synthType === 'bitcrush_glitch') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(f * (1 + (Math.random() - 0.5) * 0.1), now);
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          } else {
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
          }

          osc.frequency.setValueAtTime(f, now);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.36);

        // --- SON POUIC DU THÈME ---
        } else if (name === 'pouic') {
          const osc1 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          if (synthType === 'chiptune_8bit') {
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(240, now);
            osc1.frequency.linearRampToValueAtTime(1800, now + 0.12);
          } else if (synthType === 'crystal_ice') {
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(600, now);
            osc1.frequency.exponentialRampToValueAtTime(2400, now + 0.14);
          } else if (synthType === 'retro_brass') {
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(280, now);
            osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.16);
          } else {
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(320, now);
            osc1.frequency.exponentialRampToValueAtTime(1450, now + 0.14);
          }

          gain.gain.setValueAtTime(0.65, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc1.connect(gain);
          gain.connect(master);
          osc1.start(now);
          osc1.stop(now + 0.16);

        // --- POUIC SLAM (SUB-BASS EXPLOSIF DU THÈME) ---
        } else if (name === 'slam') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (synthType === 'warm_saw' || synthType === 'retro_brass') ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + 0.34);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.35);

        // --- PERFECT TIMING ---
        } else if (name === 'perfect') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1046.5, now);
          osc.frequency.setValueAtTime(2093.0, now + 0.06);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.21);

        // --- VOID COIN GAIN ---
        } else if (name === 'coin') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.27);

        // --- UI CLICK ---
        } else if (name === 'ui_click') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.05);

        // --- FAIL / SURCHAUFFE ---
        } else if (name === 'fail') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(50, now + 0.28);
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.29);
        }
      }
    }

    // =====================================================================
    // 3. GÉNÉRATEURS D'ENVIRONNEMENTS VISUELS ANIMÉS POUR CHAQUE THÈME
    // =====================================================================
    class DynamicThemeBackgrounds {
      constructor() {
        this.matrixDrops = Array.from({ length: 45 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          speed: 3 + Math.random() * 8,
          chars: "01POUICNEXUS789ABCDEF"
        }));

        this.sakuraPetals = Array.from({ length: 35 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 6 + Math.random() * 8,
          vx: 0.5 + Math.random() * 1.5,
          vy: 0.8 + Math.random() * 1.8,
          rot: Math.random() * Math.PI * 2
        }));

        this.solarEmbers = Array.from({ length: 40 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 2 + Math.random() * 5,
          speed: 1.5 + Math.random() * 3.5
        }));
      }

      draw(ctx, themeId, phase, w, h, cx, cy) {
        // --- 1. VOID AMETHYST (Nébuleuse violette tourbillonnante) ---
        if (themeId === "amethyst") {
          const pulse = (Math.sin(phase * 0.5) + 1.0) * 0.5;
          const rGlow = 360 + pulse * 45;
          const grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, rGlow);
          grad.addColorStop(0, "#16022c");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, rGlow, 0, Math.PI * 2);
          ctx.fill();

        // --- 2. CYBER ICE (Blizzard & Aurore polaire glaciale) ---
        } else if (themeId === "cyber_ice") {
          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, "rgba(2, 23, 43, 0.4)");
          grad.addColorStop(0.5, "rgba(0, 247, 255, 0.08)");
          grad.addColorStop(1, "rgba(2, 15, 30, 0.6)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 90) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
          }

        // --- 3. MATRIX CODE (Pluie de code binaire vert en cascade) ---
        } else if (themeId === "matrix_neon") {
          ctx.fillStyle = "rgba(0, 255, 100, 0.6)";
          ctx.font = "bold 13px Consolas";
          this.matrixDrops.forEach(d => {
            d.y += d.speed;
            if (d.y > h) {
              d.y = 0;
              d.x = Math.random() * w;
            }
            const char = d.chars[Math.floor(Math.random() * d.chars.length)];
            ctx.fillText(char, d.x, d.y);
          });

        // --- 4. SOLAR FLARE (Éruption solaire & braises de lave montantes) ---
        } else if (themeId === "solar_flare") {
          const grad = ctx.createRadialGradient(cx, cy + 100, 40, cx, cy + 100, 420);
          grad.addColorStop(0, "rgba(255, 80, 0, 0.25)");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          this.solarEmbers.forEach(e => {
            e.y -= e.speed;
            if (e.y < 0) {
              e.y = h;
              e.x = Math.random() * w;
            }
            ctx.fillStyle = "rgba(251, 191, 36, 0.7)";
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
            ctx.fill();
          });

        // --- 5. BLOOD MOON (Éclipse carmin & halos sombres) ---
        } else if (themeId === "blood_moon") {
          const moonR = 140;
          ctx.fillStyle = "rgba(185, 28, 28, 0.2)";
          ctx.beginPath();
          ctx.arc(cx, cy - 80, moonR + 30, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(15, 3, 3, 0.95)";
          ctx.beginPath();
          ctx.arc(cx, cy - 80, moonR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = 2;
          ctx.stroke();

        // --- 6. SAKURA VAPOR (Pétales de cerisiers néo-Tokyo) ---
        } else if (themeId === "sakura_vapor") {
          this.sakuraPetals.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += 0.02;
            if (p.y > h || p.x > w) {
              p.y = -10;
              p.x = Math.random() * w;
            }
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = "rgba(244, 114, 182, 0.65)";
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

        // --- 7. SYNTHWAVE 84 (Grille 3D rétro-futuriste & soleil d'horizon) ---
        } else if (themeId === "synthwave_84") {
          const sunY = cy - 60;
          const grad = ctx.createLinearGradient(cx, sunY - 90, cx, sunY + 90);
          grad.addColorStop(0, "#fbbf24");
          grad.addColorStop(1, "#ec4899");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, sunY, 90, Math.PI, 0, false);
          ctx.fill();

          // Grille perspective
          ctx.strokeStyle = "rgba(236, 72, 153, 0.25)";
          ctx.lineWidth = 1.5;
          const horizon = cy + 60;
          for (let x = -w; x < w * 2; x += 70) {
            ctx.beginPath();
            ctx.moveTo(cx, horizon);
            ctx.lineTo(x, h);
            ctx.stroke();
          }
          for (let y = horizon; y < h; y += 22) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

        // --- 8. QUANTUM GLITCH (Scanlines & distorsion de réalité) ---
        } else if (themeId === "quantum_glitch") {
          ctx.fillStyle = "rgba(6, 182, 212, 0.04)";
          for (let y = 0; y < h; y += 6) {
            ctx.fillRect(0, y, w, 2);
          }
          if (Math.random() < 0.1) {
            ctx.fillStyle = "rgba(236, 72, 153, 0.15)";
            ctx.fillRect(0, Math.random() * h, w, Math.random() * 20);
          }

        // --- 9. DARK MATTER (Trou noir gravitationnel & vortex) ---
        } else if (themeId === "dark_matter") {
          const vortexR = 220;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(phase * 0.4);
          const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, vortexR);
          grad.addColorStop(0, "#000000");
          grad.addColorStop(0.7, "rgba(100, 116, 139, 0.25)");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, vortexR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

        // --- 10. HYPER GOLD (Rayons dorés royaux & mandalas) ---
        } else if (themeId === "hyper_gold") {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(phase * 0.15);
          ctx.strokeStyle = "rgba(250, 204, 21, 0.12)";
          ctx.lineWidth = 2;
          for (let i = 0; i < 12; i++) {
            ctx.rotate(Math.PI / 6);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(w, 0);
            ctx.stroke();
          }
          ctx.restore();

        // --- 11. CELESTIAL DIVINITY (Faisceaux de lumière divine sacrée) ---
        } else if (themeId === "celestial_divinity") {
          const grad = ctx.createLinearGradient(cx, 0, cx, h);
          grad.addColorStop(0, "rgba(224, 231, 255, 0.25)");
          grad.addColorStop(0.6, "rgba(192, 132, 252, 0.08)");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(cx - 150, 0);
          ctx.lineTo(cx + 150, 0);
          ctx.lineTo(cx + 350, h);
          ctx.lineTo(cx - 350, h);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    class CloudLeaderboardService {

        this.cloudUrl = "https://kvdb.io/8D42gU9Z9rC9p4m1Qz7y/void_nexus_leaderboard";
        this.localKey = "global_leaderboard_v3";
      }

      async fetchScores() {
        try {
          const res = await fetch(this.cloudUrl);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              localStorage.setItem(this.localKey, JSON.stringify(data));
              return data;
            }
          }
        } catch (e) {
          // Utilisation du cache local
        }
        const cached = localStorage.getItem(this.localKey);
        if (cached) {
          try { return JSON.parse(cached); } catch (e) {}
        }
        return [
          { name: "👑 @zanioxx_off", score: 1450000, combo: 64, rank: "SSS VOID EMPEROR", isOwner: true },
          { name: "⚡ QUANTUM_DEV", score: 1120000, combo: 52, rank: "SSS VOID EMPEROR" },
          { name: "CYBER_NEXUS", score: 850000, combo: 41, rank: "S NEXUS MASTER" },
          { name: "NEO_RUNNER", score: 620000, combo: 33, rank: "S NEXUS MASTER" },
          { name: "GLITCH_99", score: 430000, combo: 24, rank: "A SPEED RUNNER" }
        ];
      }

      async saveScore(newEntry) {
        const scores = await this.fetchScores();
        scores.push(newEntry);
        scores.sort((a, b) => b.score - a.score);
        const topScores = scores.slice(0, 20);

        localStorage.setItem(this.localKey, JSON.stringify(topScores));
        try {
          await fetch(this.cloudUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(topScores)
          });
        } catch (e) {}
        return topScores;

          await fetch(this.cloudUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(defaultScores)
          });
        } catch (e) {}
        return defaultScores;
      }
    }

      openAuthModal() {

      }

      openAdminModal() {
        document.getElementById('god-status').textContent = this.isGodMode ? "ON" : "OFF";
        document.getElementById('admin-modal').style.display = 'flex';
      }

      bindEvents() {
        window.addEventListener('mousemove', (e) => {
          this.mousePos = { x: e.clientX, y: e.clientY };
          this.mouseTrail.push({ x: e.clientX, y: e.clientY, life: 1.0 });
        });

        window.addEventListener('pointerdown', (e) => {
          this.handleClick(e.clientX, e.clientY);
        });

        window.addEventListener('keydown', (e) => {
          this.handleKey(e);
        });
      }

      handleKey(e) {
        const key = e.key.toUpperCase();
        this.clicksHistory.push(performance.now());

        if (e.key === "Escape") {
          if (["SETTINGS", "STATS", "SHOP", "LEADERBOARD"].includes(this.state)) {
            this.state = "MENU";
            this.audio.play('ui_click');
          } else if (["PLAYING_LETTERS", "POUIC_SLAM", "GAMEOVER"].includes(this.state)) {
            this.state = "MENU";
            this.audio.play('ui_click');
          }
          return;
        }

        if (e.key === "m" || e.key === "M") {
          this.audio.toggleMute();
          return;
        }

        if (this.state === "PLAYING_LETTERS") {
          if (this.sequence.includes(key)) {
            this.validateStep(key);
          }
        } else if (this.state === "POUIC_SLAM") {
          if (e.code === "Space" || e.key === "Enter" || key === 'P') {
            this.triggerPouicSlam();
          }
        } else if (this.state === "MENU") {
          if (e.key === "Enter") {
            this.startCountdown();
          } else if (e.key === "s" || e.key === "S") {
            this.state = "SETTINGS";
            this.audio.play('ui_click');
          } else if (e.key === "b" || e.key === "B") {
            this.state = "SHOP";
            this.audio.play('ui_click');
          } else if (e.key === "l" || e.key === "L") {
            this.state = "LEADERBOARD";
            this.loadScoresAsync();
            this.audio.play('ui_click');
          }
        } else if (this.state === "GAMEOVER") {
          if (e.code === "Space" || e.key === "Enter") {
            this.startCountdown();
          }
        }
      }

      handleClick(mx, my) {
        const cx = this.width / 2;
        const cy = this.height / 2;
        this.clicksHistory.push(performance.now());

        // Bouton Profil / Login en haut à droite
        if (mx >= this.width - 240 && mx <= this.width - 20 && my >= 15 && my <= 48) {
          this.audio.play('ui_click');
          this.openAuthModal();
          return;
        }

        if (this.state === "MENU") {
          for (let [tag, btn] of Object.entries(this.menuButtons)) {
            if (mx >= btn.x1 && mx <= btn.x2 && my >= btn.y1 && my <= btn.y2) {
              this.audio.play('ui_click');
              if (tag === "PLAY") this.startCountdown();
              else if (tag === "SHOP") this.state = "SHOP";
              else if (tag === "LEADERBOARD") {
                this.state = "LEADERBOARD";
                this.loadScoresAsync();
              }
              else if (tag === "ADMIN_PANEL") this.openAdminModal();
              else if (tag === "SETTINGS") this.state = "SETTINGS";
              else if (tag === "STATS") this.state = "STATS";
              return;
            }
          }
        } else if (this.state === "SHOP") {
          for (let [tag, btn] of Object.entries(this.menuButtons)) {
            if (mx >= btn.x1 && mx <= btn.x2 && my >= btn.y1 && my <= btn.y2) {
              if (tag === "BACK_MENU") {
                this.audio.play('ui_click');
                this.state = "MENU";
                return;
              } else if (tag === "PREV_PAGE") {
                if (this.shopPage > 0) {
                  this.shopPage--;
                  this.audio.play('ui_click');
                }
                return;
              } else if (tag === "NEXT_PAGE") {
                const maxPage = Math.ceil(ALL_THEMES.length / this.themesPerPage) - 1;
                if (this.shopPage < maxPage) {
                  this.shopPage++;
                  this.audio.play('ui_click');
                }
                return;
              } else if (tag.startsWith("THEME_ACTION_")) {
                const themeId = tag.replace("THEME_ACTION_", "");
                const th = ALL_THEMES.find(t => t.id === themeId);
                if (th) {
                  if (this.unlockedThemes.includes(themeId)) {
                    this.activeThemeId = themeId;
                    this.saveData();
                    this.audio.play('pouic', this.activeThemeId);
                  } else {
                    if (this.voidCoins >= th.price) {
                      this.voidCoins -= th.price;
                      this.unlockedThemes.push(themeId);
                      this.activeThemeId = themeId;
                      this.saveData();
                      this.audio.play('perfect');
                      this.addFloatingText(cx, cy - 200, `✨ ${th.name} DÉBLOQUÉ !`, "#ffe600", 24);
                    } else {
                      this.audio.play('fail');
                      this.addFloatingText(cx, cy - 200, `❌ VOID COINS INSUFFISANTS (${th.price} 🪙 REQUIS)`, "#ef4444", 20);
                    }
                  }
                }
                return;
              }
            }
          }
        } else if (this.state === "LEADERBOARD") {
          for (let [tag, btn] of Object.entries(this.menuButtons)) {
            if (mx >= btn.x1 && mx <= btn.x2 && my >= btn.y1 && my <= btn.y2) {
              if (tag === "BACK_MENU") {
                this.audio.play('ui_click');
                this.state = "MENU";
                return;
              } else if (tag === "REFRESH_LB") {
                this.audio.play('ui_click');
                this.loadScoresAsync();
                return;
              } else if (tag === "CHANGE_NAME") {
                this.openAuthModal();
                return;
              }
            }
          }
        } else if (this.state === "SETTINGS") {
          if (mx >= cx - 190 && mx <= cx + 190 && my >= cy - 80 && my <= cy - 25) {
            const diffs = ["STANDARD", "HYPER", "VOID_GOD"];
            const idx = (diffs.indexOf(this.difficulty) + 1) % diffs.length;
            this.difficulty = diffs[idx];
            this.audio.play('ui_click');
            return;
          }
          if (mx >= cx - 190 && mx <= cx + 190 && my >= cy - 5 && my <= cy + 50) {
            this.particlesEnabled = !this.particlesEnabled;
            this.audio.play('ui_click');
            return;
          }
          if (mx >= cx - 190 && mx <= cx + 190 && my >= cy + 70 && my <= cy + 125) {
            this.shakeEnabled = !this.shakeEnabled;
            this.audio.play('ui_click');
            return;
          }
          if (mx >= cx - 110 && mx <= cx + 110 && my >= cy + 180 && my <= cy + 230) {
            this.audio.play('ui_click');
            this.state = "MENU";
            return;
          }
        } else if (this.state === "STATS") {
          if (mx >= cx - 110 && mx <= cx + 110 && my >= cy + 225 && my <= cy + 275) {
            this.audio.play('ui_click');
            this.state = "MENU";
            return;
          }
        } else if (this.state === "PLAYING_LETTERS") {
          for (let [char, orb] of Object.entries(this.buttons)) {
            if (Math.hypot(mx - orb.x, my - orb.y) <= orb.r + 20) {
              this.validateStep(char);
              break;
            }
          }
        } else if (this.state === "POUIC_SLAM") {
          if (Math.hypot(mx - cx, my - cy) <= 130) {
            this.triggerPouicSlam();
          }
        } else if (this.state === "GAMEOVER") {
          if (mx >= cx - 160 && mx <= cx + 160 && my >= cy + 110 && my <= cy + 180) {
            this.audio.play('ui_click');
            this.startCountdown();
          } else if (mx >= cx - 160 && mx <= cx + 160 && my >= cy + 195 && my <= cy + 245) {
            this.audio.play('ui_click');
            this.state = "MENU";
          }
        }
      }

      startCountdown() {
        this.state = "COUNTDOWN";
        this.stepStartTime = performance.now();
        this.audio.play('note_2', this.activeThemeId, 0.0);
      }

      startGame() {
        this.state = "PLAYING_LETTERS";
        this.currentStep = 0;
        this.roundNum = 1;
        this.score = 0;
        this.combo = 0;
        this.coinsEarnedInRun = 0;
        this.totalGames++;
        this.feverGauge = 0.0;
        this.isFever = false;

        const baseLimits = { "STANDARD": 2.4, "HYPER": 1.7, "VOID_GOD": 1.2 };
        this.timeLimit = baseLimits[this.difficulty] || 2.4;
        this.timeRemaining = this.timeLimit;
        this.stepStartTime = performance.now();

        this.audio.play('slam', this.activeThemeId);
        this.audio.play('pouic', this.activeThemeId);
        this.triggerShake(12);
        const th = this.getTheme();
        this.spawnBurst(this.width / 2, this.height / 2, th.accent, 40);
        this.addFloatingText(this.width / 2, this.height / 2 - 110, "⚡ LINK ESTABLISHED ⚡", th.primary, 30);
      }

      validateStep(char) {
        const target = this.sequence[this.currentStep];
        if (char === target) {
          const elapsed = performance.now() - this.stepStartTime;
          this.reactionTimes.push(Math.round(elapsed));
          this.stepStartTime = performance.now();
          const th = this.getTheme();

          let rating = "GOOD";
          let rCol = "#ffffff";
          let mult = 1.0;

          if (elapsed < 200) {
            rating = "PERFECT!";
            rCol = "#ffe600";
            mult = 3.0;
            this.perfectCount++;
            this.feverGauge = Math.min(1.0, this.feverGauge + 0.25);
            this.audio.play('perfect', this.activeThemeId, 0.0);
          } else if (elapsed < 380) {
            rating = "GREAT!";
            rCol = th.primary;
            mult = 2.0;
            this.feverGauge = Math.min(1.0, this.feverGauge + 0.15);
            this.audio.play(`note_${this.currentStep}`, this.activeThemeId, this.pans[this.currentStep]);
          } else {
            this.feverGauge = Math.min(1.0, this.feverGauge + 0.08);
            this.audio.play(`note_${this.currentStep}`, this.activeThemeId, this.pans[this.currentStep]);
          }

          this.combo++;
          if (this.combo > this.maxCombo) this.maxCombo = this.combo;

          const feverMult = this.isFever ? 2.0 : 1.0;
          const pts = Math.round(100 * this.roundNum * mult * feverMult);
          
          const prevScore = this.score;
          this.score += pts;

          // Void Coins (1 tous les 100 000)
          const coinsBefore = Math.floor(prevScore / 100000);
          const coinsAfter = Math.floor(this.score / 100000);
          if (coinsAfter > coinsBefore) {
            const gained = coinsAfter - coinsBefore;
            this.voidCoins += gained;
            this.coinsEarnedInRun += gained;
            this.saveData();
            this.audio.play('coin', this.activeThemeId);
            this.addFloatingText(this.width / 2, 140, `🪙 +${gained} VOID COIN !`, "#ffe600", 26);
          }

          const orb = this.buttons[char];
          if (orb) {
            this.spawnBurst(orb.x, orb.y, this.isFever ? "#ffe600" : th.primary, 18);
            this.addFloatingText(orb.x, orb.y - 35, `${rating} +${pts}`, rCol, 18);
          }

          this.currentStep++;
          if (this.currentStep >= this.sequence.length) {
            this.state = "POUIC_SLAM";
            this.timeRemaining = Math.max(0.65, this.timeLimit * 0.6);
          } else {
            this.timeRemaining = this.timeLimit;
          }
        } else {
          if (!this.isGodMode) {
            this.gameOver();
          }
        }
      }

      triggerPouicSlam() {
        this.audio.play('pouic', this.activeThemeId);
        this.audio.play('slam', this.activeThemeId);
        this.triggerShake(18);
        const cx = this.width / 2;
        const cy = this.height / 2;
        const th = this.getTheme();
        this.totalPouics++;

        const slamPts = 600 * this.combo * (this.isFever ? 2 : 1);
        const prevScore = this.score;
        this.score += slamPts;

        const coinsBefore = Math.floor(prevScore / 100000);
        const coinsAfter = Math.floor(this.score / 100000);
        if (coinsAfter > coinsBefore) {
          const gained = coinsAfter - coinsBefore;
          this.voidCoins += gained;
          this.coinsEarnedInRun += gained;
          this.saveData();
          this.audio.play('coin', this.activeThemeId);
          this.addFloatingText(cx, 140, `🪙 +${gained} VOID COIN !`, "#ffe600", 26);
        }

        this.spawnBurst(cx, cy, this.isFever ? "#ffe600" : th.accent, 60, true);
        this.addFloatingText(cx, cy - 80, `💥 POUIC SLAM ! +${slamPts}`, "#ffe600", 32);

        this.roundNum++;
        const accelFactors = { "STANDARD": 0.88, "HYPER": 0.84, "VOID_GOD": 0.80 };
        const factor = accelFactors[this.difficulty] || 0.88;
        const baseLimits = { "STANDARD": 2.4, "HYPER": 1.7, "VOID_GOD": 1.2 };
        const base = baseLimits[this.difficulty] || 2.4;

        this.timeLimit = Math.max(0.38, base * Math.pow(factor, this.roundNum - 1));
        this.timeRemaining = this.timeLimit;
        this.currentStep = 0;
        this.stepStartTime = performance.now();
        this.state = "PLAYING_LETTERS";
      }

      async gameOver() {
        this.audio.play('fail', this.activeThemeId);
        this.triggerShake(20);
        this.state = "GAMEOVER";
        this.isFever = false;

        const rankStr = this.roundNum >= 14 ? "SSS VOID EMPEROR" : (this.roundNum >= 9 ? "S NEXUS MASTER" : (this.roundNum >= 5 ? "A SPEED RUNNER" : "B NOVICE"));

        if (this.score > this.highScore) {
          this.highScore = this.score;
        }
        this.saveData();

        // Envoi au vrai Cloud Leaderboard
        const entry = {
          name: this.isOwner ? `👑 ${this.playerName}` : this.playerName,
          score: this.score,
          combo: this.maxCombo,
          rank: rankStr,
          isOwner: this.isOwner,
          date: new Date().toLocaleDateString()
        };
        this.leaderboard = await this.cloudLeaderboard.saveScore(entry);

        this.spawnBurst(this.width / 2, this.height / 2, "#ef4444", 65);
      }

      calculateCPS() {
        const now = performance.now();
        this.clicksHistory = this.clicksHistory.filter(t => (now - t) <= 2000);
        return this.clicksHistory.length / 2.0;
      }

      drawGlassCard(x, y, w, h, borderCol, fillCol = null) {
        const th = this.getTheme();
        const fill = fillCol || th.card;
        this.ctx.save();
        this.ctx.fillStyle = fill;
        this.ctx.strokeStyle = borderCol;
        this.ctx.lineWidth = 1.5;
        this.ctx.shadowBlur = 8;
        this.ctx.shadowColor = "rgba(0,0,0,0.6)";
        this.ctx.fillRect(x - w / 2, y - h / 2, w, h);
        this.ctx.strokeRect(x - w / 2, y - h / 2, w, h);
        this.ctx.restore();
      }

      drawInteractiveBtn(tag, x, y, w, h, title, subtitle = "", borderCol = "#00f0ff") {
        const mx = this.mousePos.x;
        const my = this.mousePos.y;
        const isHover = (mx >= x - w / 2 && mx <= x + w / 2 && my >= y - h / 2 && my <= y + h / 2);
        const th = this.getTheme();
        const col = isHover ? th.accent : borderCol;

        this.menuButtons[tag] = { x1: x - w / 2, y1: y - h / 2, x2: x + w / 2, y2: y + h / 2 };

        this.ctx.save();
        this.ctx.fillStyle = isHover ? "rgba(30, 15, 50, 0.9)" : th.card;
        this.ctx.strokeStyle = col;
        this.ctx.lineWidth = isHover ? 2 : 1.5;
        this.ctx.shadowBlur = isHover ? 10 : 4;
        this.ctx.shadowColor = isHover ? col : "rgba(0,0,0,0.5)";
        this.ctx.fillRect(x - w / 2, y - h / 2, w, h);
        this.ctx.strokeRect(x - w / 2, y - h / 2, w, h);

        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        if (subtitle) {
          this.ctx.font = "bold 17px Impact";
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillText(title, x, y - 8);

          this.ctx.font = "bold 11px Consolas";
          this.ctx.fillStyle = th.primary;
          this.ctx.fillText(subtitle, x, y + 14);
        } else {
          this.ctx.font = "bold 18px Impact";
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillText(title, x, y);
        }
        this.ctx.restore();
      }

      loop(now) {
        const dt = (now - this.lastTick) / 1000;
        this.lastTick = now;
        this.phase += 0.07;
        const th = this.getTheme();

        // Fever / Overdrive
        if (this.feverGauge >= 1.0 && !this.isFever) {
          this.isFever = true;
          this.addFloatingText(this.width / 2, 120, "⚡ OVERDRIVE ACTIVE (x2 POINTS) ⚡", "#ffe600", 24);
        }
        if (this.isFever) {
          this.feverGauge = Math.max(0.0, this.feverGauge - dt * 0.15);
          if (this.feverGauge <= 0.0) this.isFever = false;
        }

        // Screen Shake
        let offX = 0, offY = 0;
        if (this.shakeAmount > 0) {
          offX = (Math.random() - 0.5) * this.shakeAmount * 1.5;
          offY = (Math.random() - 0.5) * this.shakeAmount * 1.5;
          this.shakeAmount *= 0.85;
        }

        const cx = this.width / 2 + offX;
        const cy = this.height / 2 + offY;

        // Effacer écran
        this.ctx.fillStyle = "#05030a";
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.menuButtons = {};

        // 1. Fond Animé Unique du Thème Actif
        this.bgEngine.draw(this.ctx, this.activeThemeId, this.phase, this.width, this.height, cx, cy);

        // 2. Visualiseur Audio discret
        this.audio.vizLevel *= 0.92;
        const numBars = 36;
        const bw = this.width / numBars;
        for (let i = 0; i < numBars; i++) {
          const waveH = (Math.sin(this.phase * 2.2 + i * 0.35) + 1.0) * 0.5;
          const bh = 3 + (this.audio.vizLevel * 55.0 * waveH);
          const bx = i * bw;
          this.ctx.fillStyle = this.isFever ? "#ffe600" : (i % 2 === 0 ? th.primary : th.secondary);
          this.ctx.globalAlpha = 0.5;
          this.ctx.fillRect(bx + 2, this.height - bh, bw - 4, bh);
          this.ctx.globalAlpha = 1.0;
        }

        // 3. Particules & Textes
        for (let i = this.sparks.length - 1; i >= 0; i--) {
          const p = this.sparks[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.92;
          p.vy *= 0.92;
          p.life -= 0.025;
          if (p.life <= 0) {
            this.sparks.splice(i, 1);
          } else {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life * 0.85;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
          }
        }

        for (let i = this.floatingScores.length - 1; i >= 0; i--) {
          const ft = this.floatingScores[i];
          ft.y += ft.vy;
          ft.vy *= 0.94;
          ft.life -= 0.028;
          if (ft.life <= 0) {
            this.floatingScores.splice(i, 1);
          } else {
            this.ctx.fillStyle = ft.color;
            this.ctx.globalAlpha = ft.life;
            this.ctx.font = `bold ${Math.round(ft.size * ft.life)}px Impact`;
            this.ctx.textAlign = "center";
            this.ctx.fillText(ft.text, ft.x, ft.y);
            this.ctx.globalAlpha = 1.0;
          }
        }

        // 4. Header HUD Supérieur
        this.ctx.textAlign = "left";
        this.ctx.font = "15px Impact";
        this.ctx.fillStyle = th.primary;
        this.ctx.fillText("VOID POUIC NEXUS", 25, 28);
        this.ctx.font = "bold 11px Consolas";
        this.ctx.fillStyle = th.accent;
        this.ctx.fillText("by @zanioxx_off", 25, 44);

        // Void Coins Badge
        this.ctx.textAlign = "center";
        this.ctx.fillStyle = "rgba(23, 16, 43, 0.85)";
        this.ctx.strokeStyle = "#fbbf24";
        this.ctx.lineWidth = 1;
        this.ctx.strokeRect(cx - 100, 16, 200, 32);
        this.ctx.fillRect(cx - 100, 16, 200, 32);

        this.ctx.font = "bold 13px Consolas";
        this.ctx.fillStyle = "#fbbf24";
        this.ctx.fillText(`🪙 ${this.voidCoins.toLocaleString()} VOID COINS`, cx, 36);

        // Profil & Login
        const authBadge = this.isOwner ? `👑 OWNER: ${this.playerName}` : `👤 ${this.playerName}`;
        this.ctx.textAlign = "right";
        this.ctx.fillStyle = this.isOwner ? "rgba(251, 191, 36, 0.15)" : "rgba(255, 255, 255, 0.08)";
        this.ctx.strokeStyle = this.isOwner ? "#fbbf24" : "rgba(255, 255, 255, 0.2)";
        this.ctx.strokeRect(this.width - 240, 16, 220, 32);
        this.ctx.fillRect(this.width - 240, 16, 220, 32);

        this.ctx.font = "bold 12px Consolas";
        this.ctx.fillStyle = this.isOwner ? "#fbbf24" : "#e2e8f0";
        this.ctx.fillText(authBadge, this.width - 30, 36);

        // Bannière d'annonce mondiale
        if (this.globalBroadcast) {
          this.ctx.fillStyle = "rgba(239, 68, 68, 0.2)";
          this.ctx.fillRect(0, 56, this.width, 22);
          this.ctx.textAlign = "center";
          this.ctx.font = "bold 11px Consolas";
          this.ctx.fillStyle = "#fca5a5";
          this.ctx.fillText(`📢 ANNONCE MONDIALE : ${this.globalBroadcast}`, this.width / 2, 71);
        }

        // 5. Machine d'États
        if (this.state === "MENU") {
          this.ctx.textAlign = "center";
          this.ctx.font = "bold 54px Impact";
          this.ctx.fillStyle = th.primary;
          this.ctx.fillText("VOID POUIC NEXUS", cx, cy - 170);

          this.ctx.font = "bold 15px Consolas";
          this.ctx.fillStyle = th.accent;
          this.ctx.fillText("⚡ TRANSCENDENCE 3.0 // BY @ZANIOXX_OFF ⚡", cx, cy - 124);

          this.ctx.font = "bold 12px Consolas";
          this.ctx.fillStyle = "#94a3b8";
          this.ctx.fillText(`THÈME : ${th.name} (${th.desc})  |  MODE : ${this.difficulty}`, cx, cy - 85);

          this.drawInteractiveBtn("PLAY", cx, cy - 20, 330, 64, "🎮 JOUER", "[CLIQUE OU ENTRÉE]", th.primary);
          this.drawInteractiveBtn("SHOP", cx, cy + 52, 330, 48, "🛍️ BOUTIQUE DE THÈMES", "[11 FONDS & SONS UNIQUES]", "#fbbf24");
          this.drawInteractiveBtn("LEADERBOARD", cx, cy + 108, 330, 48, "🏆 CLASSEMENT MONDIAL", "[VRAIS JOUEURS CLOUD]", th.secondary);

          if (this.isOwner) {
            this.drawInteractiveBtn("ADMIN_PANEL", cx, cy + 164, 330, 48, "👑 PANNEAU STAFF / OWNER", "[GESTION COMPLETE]", "#fbbf24");
            this.drawInteractiveBtn("SETTINGS", cx - 85, cy + 220, 155, 42, "⚙️ PARAMÈTRES", "", "#64748b");
            this.drawInteractiveBtn("STATS", cx + 85, cy + 220, 155, 42, "📊 STATISTIQUES", "", "#64748b");
          } else {
            this.drawInteractiveBtn("SETTINGS", cx, cy + 164, 330, 44, "⚙️ PARAMÈTRES", "", "#64748b");
            this.drawInteractiveBtn("STATS", cx, cy + 216, 330, 44, "📊 STATISTIQUES", "", "#64748b");
          }

        // --- BOUTIQUE DE THÈMES ---
        } else if (this.state === "SHOP") {
          this.drawGlassCard(cx, cy, 660, 560, "#fbbf24");
          this.ctx.textAlign = "center";
          this.ctx.font = "28px Impact";
          this.ctx.fillStyle = "#fbbf24";
          this.ctx.fillText("🛍️ BOUTIQUE DE THÈMES & SONS DU VOID", cx, cy - 235);

          this.ctx.font = "bold 12px Consolas";
          this.ctx.fillStyle = "#94a3b8";
          this.ctx.fillText(`SOLDE : ${this.voidCoins} VOID COINS (1 pièce gagnée tous les 100.000 pts de score)`, cx, cy - 208);

          const startIdx = this.shopPage * this.themesPerPage;
          const pageThemes = ALL_THEMES.slice(startIdx, startIdx + this.themesPerPage);

          pageThemes.forEach((item, i) => {
            const rowY = cy - 150 + i * 85;
            const isUnlocked = this.unlockedThemes.includes(item.id);
            const isEquipped = (this.activeThemeId === item.id);

            this.ctx.fillStyle = "rgba(15, 10, 28, 0.9)";
            this.ctx.strokeStyle = isEquipped ? item.primary : (isUnlocked ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.08)");
            this.ctx.lineWidth = isEquipped ? 2 : 1;
            this.ctx.fillRect(cx - 290, rowY, 580, 72);
            this.ctx.strokeRect(cx - 290, rowY, 580, 72);

            this.ctx.fillStyle = item.primary;
            this.ctx.beginPath();
            this.ctx.arc(cx - 260, rowY + 36, 14, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.textAlign = "left";
            this.ctx.font = "bold 16px Impact";
            this.ctx.fillStyle = "#ffffff";
            this.ctx.fillText(item.name, cx - 230, rowY + 28);

            this.ctx.font = "11px Consolas";
            this.ctx.fillStyle = "#94a3b8";
            this.ctx.fillText(`${item.desc} • Audio: ${item.synth}`, cx - 230, rowY + 50);

            let btnText = "ÉQUIPER";
            let btnBorder = item.primary;
            if (isEquipped) {
              btnText = "✓ ÉQUIPÉ";
              btnBorder = "#22c55e";
            } else if (!isUnlocked) {
              btnText = `ACHETER (${item.price} 🪙)`;
              btnBorder = this.voidCoins >= item.price ? "#fbbf24" : "#ef4444";
            }

            this.drawInteractiveBtn(`THEME_ACTION_${item.id}`, cx + 210, rowY + 36, 130, 42, btnText, "", btnBorder);
          });

          const maxPage = Math.ceil(ALL_THEMES.length / this.themesPerPage);
          this.drawInteractiveBtn("PREV_PAGE", cx - 180, cy + 235, 100, 38, "◀ PRÉC", "", this.shopPage > 0 ? th.primary : "#475569");
          this.ctx.textAlign = "center";
          this.ctx.font = "bold 12px Consolas";
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillText(`PAGE ${this.shopPage + 1} / ${maxPage}`, cx, cy + 235);
          this.drawInteractiveBtn("NEXT_PAGE", cx + 180, cy + 235, 100, 38, "SUIV ▶", "", this.shopPage < maxPage - 1 ? th.primary : "#475569");

          this.drawInteractiveBtn("BACK_MENU", cx, cy + 240, 120, 38, "RETOUR", "", "#ef4444");

        // --- LEADERBOARD MONDIAL (CLOUD LIVE) ---
        } else if (this.state === "LEADERBOARD") {
          this.drawGlassCard(cx, cy, 640, 560, th.secondary);
          this.ctx.textAlign = "center";
          this.ctx.font = "28px Impact";
          this.ctx.fillStyle = th.secondary;
          this.ctx.fillText("🏆 CLASSEMENT MONDIAL EN LIGNE (CLOUD LIVE)", cx, cy - 235);

          this.ctx.font = "bold 12px Consolas";
          this.ctx.fillStyle = "#94a3b8";
          this.ctx.fillText(`CONNECTÉ : ${this.isOwner ? '👑 ' : ''}${this.playerName}  |  CLASSEMENT SYNCHRONISÉ MONDIALEMENT`, cx, cy - 208);

          this.leaderboard.slice(0, 6).forEach((item, idx) => {
            const rowY = cy - 165 + idx * 56;
            const isMe = item.name.includes(this.playerName);

            this.ctx.fillStyle = isMe ? "rgba(168, 85, 247, 0.18)" : "rgba(15, 10, 28, 0.85)";
            this.ctx.strokeStyle = isMe ? th.secondary : "rgba(255,255,255,0.08)";
            this.ctx.lineWidth = 1;
            this.ctx.fillRect(cx - 280, rowY, 560, 48);
            this.ctx.strokeRect(cx - 280, rowY, 560, 48);

            const medals = ["🥇", "🥈", "🥉", `#4`, `#5`, `#6`];
            this.ctx.textAlign = "left";
            this.ctx.font = "bold 15px Consolas";
            this.ctx.fillStyle = idx === 0 ? "#fbbf24" : (idx === 1 ? "#cbd5e1" : (idx === 2 ? "#d97706" : "#94a3b8"));
            this.ctx.fillText(medals[idx], cx - 260, rowY + 30);

            this.ctx.font = "bold 14px Consolas";
            this.ctx.fillStyle = item.isOwner ? "#fbbf24" : "#ffffff";
            this.ctx.fillText(item.name, cx - 200, rowY + 30);

            this.ctx.textAlign = "right";
            this.ctx.font = "bold 15px Impact";
            this.ctx.fillStyle = th.primary;
            this.ctx.fillText(`${item.score.toLocaleString()} PTS`, cx + 170, rowY + 30);

            this.ctx.font = "11px Consolas";
            this.ctx.fillStyle = "#94a3b8";
            this.ctx.fillText(`x${item.combo}`, cx + 250, rowY + 30);
          });

          this.drawInteractiveBtn("REFRESH_LB", cx - 180, cy + 225, 130, 44, "🔄 ACTUALISER", "", th.primary);
          this.drawInteractiveBtn("CHANGE_NAME", cx, cy + 225, 180, 44, "👤 MON PROFIL", "", th.secondary);
          this.drawInteractiveBtn("BACK_MENU", cx + 160, cy + 225, 110, 44, "RETOUR", "", "#ef4444");

        // --- PARAMÈTRES ---
        } else if (this.state === "SETTINGS") {
          this.drawGlassCard(cx, cy, 520, 500, th.primary);
          this.ctx.textAlign = "center";
          this.ctx.font = "28px Impact";
          this.ctx.fillStyle = th.primary;
          this.ctx.fillText("⚙️ PARAMÈTRES DU NEXUS", cx, cy - 190);

          this.drawInteractiveBtn("DIFF_TOGGLE", cx, cy - 50, 360, 52, `⚡ DIFFICULTÉ : ${this.difficulty}`, "[CLIQUE POUR CHANGER]", th.secondary);
          this.drawInteractiveBtn("PARTICLES_TOGGLE", cx, cy + 20, 360, 52, `✨ PARTICULES : ${this.particlesEnabled ? "ACTIVÉES" : "DÉSACTIVÉES"}`, "[CLIQUE POUR BASCULER]", th.secondary);
          this.drawInteractiveBtn("SHAKE_TOGGLE", cx, cy + 95, 360, 52, `📳 SECOUSSES D'ÉCRAN : ${this.shakeEnabled ? "ACTIVÉES" : "DÉSACTIVÉES"}`, "[CLIQUE POUR BASCULER]", th.secondary);
          this.drawInteractiveBtn("BACK_MENU", cx, cy + 200, 200, 44, "RETOUR", "[OU ÉCHAP]", "#ef4444");

        // --- STATISTIQUES ---
        } else if (this.state === "STATS") {
          this.drawGlassCard(cx, cy, 540, 520, th.accent);
          this.ctx.textAlign = "center";
          this.ctx.font = "28px Impact";
          this.ctx.fillStyle = th.accent;
          this.ctx.fillText("📊 TÉLÉMÉTRIE & RECORDS", cx, cy - 200);

          const recent = this.reactionTimes.slice(-20);
          const avgReact = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : 0;

          const statsLines = [
            `MEILLEUR SCORE : ${this.highScore.toLocaleString()} PTS`,
            `PARTIES JOUÉES : ${this.totalGames}`,
            `SOLDE TOTAL : ${this.voidCoins} VOID COINS`,
            `THÈMES DÉBLOQUÉS : ${this.unlockedThemes.length} / ${ALL_THEMES.length}`,
            `TEMPS DE RÉACTION MOYEN : ${avgReact} ms`,
            `PERFECT TIMINGS : ${this.perfectCount}`,
            `POUIC SLAMS RÉUSSIS : ${this.totalPouics}`
          ];

          this.ctx.font = "bold 13px Consolas";
          this.ctx.fillStyle = "#ffffff";
          statsLines.forEach((line, idx) => {
            this.ctx.fillText(line, cx, cy - 130 + idx * 36);
          });

          this.drawInteractiveBtn("BACK_MENU", cx, cy + 215, 200, 44, "RETOUR", "[OU ÉCHAP]", th.primary);

        // --- COMPTE À REBOURS ---
        } else if (this.state === "COUNTDOWN") {
          const elapsed = (performance.now() - this.stepStartTime) / 1000;
          const count = 3 - Math.floor(elapsed);
          if (count > 0) {
            this.ctx.textAlign = "center";
            this.ctx.font = "bold 110px Impact";
            this.ctx.fillStyle = th.primary;
            this.ctx.fillText(count, cx, cy);
            this.ctx.font = "bold 16px Consolas";
            this.ctx.fillStyle = "#ffffff";
            this.ctx.fillText("PREPARE YOUR REFLEXES...", cx, cy + 65);
          } else {
            this.startGame();
          }

        // --- EN JEU (LETTRES P-O-U-I-C & POUIC SLAM) ---
        } else if (this.state === "PLAYING_LETTERS" || this.state === "POUIC_SLAM") {
          this.timeRemaining -= dt;
          if (this.timeRemaining <= 0) {
            if (!this.isGodMode) {
              this.gameOver();
            } else {
              this.timeRemaining = this.timeLimit;
            }
          }

          const cps = this.calculateCPS();
          const recent = this.reactionTimes.slice(-5);
          const avgReact = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : 0;

          // HUD Live
          this.ctx.textAlign = "center";
          this.ctx.font = "24px Impact";
          this.ctx.fillStyle = this.isFever ? "#ffe600" : th.primary;
          this.ctx.fillText(`SCORE: ${this.score.toLocaleString()}`, cx - 250, 75);

          this.ctx.fillStyle = th.accent;
          this.ctx.fillText(`CYCLE: x${this.roundNum}`, cx + 250, 75);

          this.ctx.font = "bold 13px Consolas";
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillText(`COMBO: x${this.combo}  |  ${cps.toFixed(1)} CPS  |  ${avgReact} ms`, cx, 75);

          // Jauge Overdrive
          const fgW = 260;
          this.ctx.strokeStyle = th.secondary;
          this.ctx.strokeRect(cx - fgW / 2, 95, fgW, 7);
          this.ctx.fillStyle = this.isFever ? "#ffe600" : th.primary;
          this.ctx.fillRect(cx - fgW / 2, 95, fgW * this.feverGauge, 7);

          // Timer Circular Arc
          const timerR = Math.min(190, this.width * 0.22);
          const ratio = Math.max(0.0, this.timeRemaining / this.timeLimit);
          const gaugeCol = ratio > 0.4 ? th.primary : (ratio > 0.2 ? "#ffe600" : "#ef4444");

          this.ctx.lineWidth = 5;
          this.ctx.strokeStyle = gaugeCol;
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, timerR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio, false);
          this.ctx.stroke();

          // Orbs Disposition
          this.buttons = {};
          const n = this.sequence.length;
          const radiusLayout = Math.min(235, this.width * 0.35);
          const startAng = -Math.PI * 0.82;
          const endAng = -Math.PI * 0.18;
          const coords = [];

          for (let i = 0; i < n; i++) {
            const char = this.sequence[i];
            const ang = startAng + i * (endAng - startAng) / (n - 1);
            const bx = cx + Math.cos(ang) * radiusLayout;
            const by = cy + Math.sin(ang) * (radiusLayout * 0.72) + 30;
            coords.push({ x: bx, y: by });
            this.buttons[char] = { x: bx, y: by, r: 38 };
          }

          // Faisceaux Lasers
          for (let i = 0; i < coords.length - 1; i++) {
            this.ctx.strokeStyle = this.isFever ? "#ffe600" : (i >= this.currentStep ? "rgba(255,255,255,0.08)" : th.primary);
            this.ctx.lineWidth = 2.5;
            this.ctx.beginPath();
            this.ctx.moveTo(coords[i].x, coords[i].y);
            this.ctx.lineTo(coords[i + 1].x, coords[i + 1].y);
            this.ctx.stroke();
          }

          // Orbes P-O-U-I-C
          for (let i = 0; i < n; i++) {
            const char = this.sequence[i];
            const orb = coords[i];
            const isTarget = (i === this.currentStep) && (this.state === "PLAYING_LETTERS");
            const isDone = (i < this.currentStep);

            if (isTarget) {
              const pulseT = Math.sin(this.phase * 2.2) * 5;
              this.ctx.strokeStyle = th.accent;
              this.ctx.lineWidth = 1.5;
              this.ctx.beginPath();
              this.ctx.arc(orb.x, orb.y, 38 + 8 + pulseT, 0, Math.PI * 2);
              this.ctx.stroke();
            }

            this.ctx.fillStyle = isDone ? th.primary : (isTarget ? th.card : "#0a0614");
            this.ctx.strokeStyle = isTarget ? "#ffffff" : (isDone ? th.primary : "rgba(255,255,255,0.15)");
            this.ctx.lineWidth = 2;

            this.ctx.beginPath();
            this.ctx.arc(orb.x, orb.y, 38, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.stroke();

            this.ctx.fillStyle = isDone ? "#000000" : "#ffffff";
            this.ctx.font = "bold 26px Impact";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "middle";
            this.ctx.fillText(char, orb.x, orb.y);
          }

          // Action Centrale
          if (this.state === "PLAYING_LETTERS") {
            const targetChar = this.sequence[this.currentStep];
            this.ctx.font = "bold 32px Impact";
            this.ctx.fillStyle = "#ffffff";
            this.ctx.fillText(`FRAPPE : ${targetChar}`, cx, cy);
          } else if (this.state === "POUIC_SLAM") {
            const pulseSlam = Math.sin(this.phase * 3.0) * 7;
            this.ctx.fillStyle = th.accent;
            this.ctx.strokeStyle = "#ffe600";
            this.ctx.lineWidth = 2.5;
            this.ctx.beginPath();
            this.ctx.arc(cx, cy, 70 + pulseSlam, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.stroke();

            this.ctx.fillStyle = "#ffffff";
            this.ctx.font = "bold 22px Impact";
            this.ctx.fillText("POUIC", cx, cy - 10);
            this.ctx.fillText("SLAM!", cx, cy + 14);
          }

        // --- GAME OVER ---
        } else if (this.state === "GAMEOVER") {
          this.ctx.textAlign = "center";
          this.ctx.font = "bold 44px Impact";
          this.ctx.fillStyle = "#ef4444";
          this.ctx.fillText("SURCHAUFFE DU SYSTÈME", cx, cy - 130);

          this.ctx.font = "bold 18px Consolas";
          this.ctx.fillStyle = th.primary;
          this.ctx.fillText(`SCORE FINAL : ${this.score.toLocaleString()}   |   RECORD : ${this.highScore.toLocaleString()}`, cx, cy - 65);

          const rankStr = this.roundNum >= 14 ? "SSS VOID EMPEROR" : (this.roundNum >= 9 ? "S NEXUS MASTER" : (this.roundNum >= 5 ? "A SPEED RUNNER" : "B NOVICE"));
          this.ctx.font = "bold 13px Consolas";
          this.ctx.fillStyle = "#ffe600";
          this.ctx.fillText(`RANG ÉVALUÉ : ${rankStr} (MAX COMBO: x${this.maxCombo})`, cx, cy - 25);

          if (this.coinsEarnedInRun > 0) {
            this.ctx.fillStyle = "#fbbf24";
            this.ctx.fillText(`🪙 GAIN : +${this.coinsEarnedInRun} VOID COIN(S) (TOTAL : ${this.voidCoins})`, cx, cy + 5);
          }

          this.drawInteractiveBtn("RETRY", cx, cy + 140, 280, 68, "🔄 REJOUER", "[CLIQUE OU ENTRÉE]", th.primary);
          this.drawInteractiveBtn("MENU_BTN", cx, cy + 215, 280, 46, "🏠 MENU PRINCIPAL", "", th.secondary);
        }

        // Traînée de curseur
        for (let i = this.mouseTrail.length - 1; i >= 0; i--) {
          const pt = this.mouseTrail[i];
          pt.life -= 0.08;
          if (pt.life <= 0) {
            this.mouseTrail.splice(i, 1);
          } else {
            this.ctx.fillStyle = th.primary;
            this.ctx.globalAlpha = pt.life * 0.7;
            this.ctx.beginPath();
            this.ctx.arc(pt.x, pt.y, 5 * pt.life, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
          }
        }

        // Barre d'aide
        this.ctx.textAlign = "center";
        this.ctx.font = "11px Consolas";
        this.ctx.fillStyle = "#64748b";
        this.ctx.fillText("[P][O][U][I][C] Clavier/Souris/Tactile  |  [ESPACE] Pouic Slam  |  [M] Muet  •  by @zanioxx_off", this.width / 2, this.height - 15);

        requestAnimationFrame((t) => this.loop(t));
      }
    }

    // Initialisation
    const game = new VoidGame();
    document.getElementById('init-btn').addEventListener('click', () => {
      game.audio.init();
      game.audio.play('ui_click');
      document.getElementById('audio-overlay').style.display = 'none';
    });
  </script>
</body>
</html>
